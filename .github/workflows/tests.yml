name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    name: rubocop
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            rails: "8.0"
            db: "sqlite"

          - ruby: "3.3"
            rails: "8.1"
            db: "sqlite"

          - ruby: "3.4"
            rails: "8.1"
            db: "sqlite"

          - ruby: "4.0"
            rails: "8.1"
            db: "mysql"

          - ruby: "4.0"
            rails: "8.1"
            db: "trilogy"

          - ruby: "4.0"
            rails: "8.1"
            db: "pg"

          - ruby: "4.0"
            rails: "8.1"
            db: "sqlite"
    name: rails ${{ matrix.rails }}, ruby ${{ matrix.ruby }}, ${{ matrix.db }}

    env:
      DB: ${{ matrix.db }}
      RAILS: ${{ matrix.rails }}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      MYSQL_HOST: "127.0.0.1"
      MYSQL_USER: "root"

    # A service whose image is an empty string is not started, so each job
    # only runs the database it tests against.
    services:
      pg:
        image: ${{ matrix.db == 'pg' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: active_reporting_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ (matrix.db == 'mysql' || matrix.db == 'trilogy') && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: active_reporting_test
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: bundle exec rake test
