<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108 640" width="1108" height="640" role="img" aria-labelledby="title desc">
<title id="title">Snowflake schema</title>
<desc id="desc">The same sales fact table, but its dimension tables are normalized: sales_reps reference regions, phones reference manufacturers and operating_systems, and stores reference cities, which reference states. sale_dates is left as-is.</desc>
<style>
  .bg { fill: none; }
  .box { stroke: #cbd5e1; stroke-width: 1; }
  .body { fill: #ffffff; }
  .h-fact { fill: #1d4ed8; } .h-dim { fill: #0f766e; } .h-sub { fill: #99f6e4; }
  .t-fact, .t-dim { fill: #ffffff; } .t-sub { fill: #134e4a; }
  .title { font: 600 14px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .col { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; fill: #0f172a; }
  .tag { font: 600 10px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: .04em; }
  .tag-pk { fill: #b45309; } .tag-fk { fill: #0f766e; } .tag-measure { fill: #1d4ed8; }
  .sep { stroke: #e2e8f0; stroke-width: 1; }
  .edge { fill: none; stroke: #64748b; stroke-width: 1.5; }
  .dot { fill: #64748b; }
  .legend { font: 12px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #475569; }
  @media (prefers-color-scheme: dark) {
    .box { stroke: #475569; }
    .body { fill: #0f172a; }
    .h-fact { fill: #2563eb; } .h-dim { fill: #0d9488; } .h-sub { fill: #134e4a; }
    .t-sub { fill: #ccfbf1; }
    .col { fill: #e2e8f0; }
    .tag-pk { fill: #fbbf24; } .tag-fk { fill: #5eead4; } .tag-measure { fill: #93c5fd; }
    .sep { stroke: #1e293b; }
    .edge { stroke: #94a3b8; }
    .dot { fill: #94a3b8; }
    .legend { fill: #94a3b8; }
  }
</style>
