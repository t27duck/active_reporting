plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/ParameterLists:
  Max: 8

Metrics/MethodLength:
  Max: 50

Style/ClassAndModuleChildren:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/RaiseArgs:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - test/schema.rb

# Tests often check several related facts about one result
Minitest/MultipleAssertions:
  Max: 6
